name: Build ytcui-dl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Clone upstream ytcui-dl
        run: git clone --depth 1 https://github.com/MilkmanAbi/ytcui-dl.git ytcui-dl

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev pkg-config

      - name: Build (static)
        working-directory: ytcui-dl
        run: make -j"$(nproc)" \
               CFLAGS="-O3 -pipe -mcpu=neoverse-n1 -DNDEBUG" \
               LDFLAGS="-static"

      - name: Verify
        working-directory: ytcui-dl
        run: |
          file ytcui-dl
          ./ytcui-dl --help || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ytcui-dl-linux-arm64-static
          path: ytcui-dl/ytcui-dl
          if-no-files-found: error
